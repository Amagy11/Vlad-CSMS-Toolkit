<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление эталонами</title>
    <style>
        /* Основные стили */
        * { box-sizing: border-box; transition: all 0.3s ease; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            background: linear-gradient(to bottom, #f5f7fa 0%, #e4e7eb 100%);
            background-attachment: fixed;
            color: #333;
            min-height: 100vh;
        }
        
        /* Шапка сайта */
        header {
            background: linear-gradient(to bottom, #003366 0%, #002244 100%);
            color: #ffffff;
            padding: 15px 20px;
            box-shadow: 0 4px 12px rgba(0, 34, 68, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        /* Кнопки управления */
        .controls {
            padding: 0 20px;
            margin-bottom: 20px;
        }
        
        button {
            padding: 10px 15px;
            background: linear-gradient(to bottom, #0066cc 0%, #003366 100%);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            box-shadow: 0 4px 8px rgba(0, 51, 102, 0.3);
            cursor: pointer;
            margin-right: 10px;
        }
        
        button:hover {
            background: linear-gradient(to bottom, #0088ff 0%, #0055aa 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 85, 170, 0.4);
        }
        
        /* Таблица */
        .table-container {
            padding: 0 20px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 34, 68, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        
        th, td {
            border: 1px solid #e0e6ed;
            padding: 12px 15px;
            text-align: left;
        }
        
        th {
            background: linear-gradient(to bottom, #0066cc 0%, #003366 100%);
            color: white;
            font-weight: 600;
            border-color: #0055aa;
        }
        
        tr:nth-child(even) { background-color: #ffffff; }
        tr:hover { background-color: rgba(0, 102, 204, 0.1); }
        
        .actions {
            display: flex;
            gap: 8px;
        }
        
        .actions button {
            padding: 6px 10px;
            font-size: 14px;
            margin: 0;
        }
        
        /* Модальные окна */
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 34, 68, 0.3);
            padding: 25px;
            z-index: 1000;
            width: 400px;
            max-width: 90%;
            border: 1px solid rgba(0, 102, 204, 0.2);
        }
        
        .modal h3 {
            margin-top: 0;
            color: #003366;
            border-bottom: 1px solid #e0e6ed;
            padding-bottom: 10px;
        }
        
        .modal label {
            display: block;
            margin: 15px 0 5px;
            color: #003366;
            font-weight: 500;
        }
        
        .modal input, .modal select {
            width: 100%;
            padding: 10px;
            border: 1px solid #e0e6ed;
            border-radius: 6px;
            background-color: #f8f9fb;
        }
        
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        
        /* Состояния */
        .expired {
            background-color: #ffebee !important;
            color: #d32f2f;
        }
        
        .expired td {
            border-color: #ffcdd2;
        }
        
        /* Адаптивность */
        @media (max-width: 768px) {
            .actions { flex-direction: column; }
            .modal { width: 90%; }
        }

        /* Стили для логина */
        .auth-container {
            max-width: 400px;
            margin: 50px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 34, 68, 0.15);
        }
        .auth-title {
            font-size: 24px;
            font-weight: bold;
            color: #003366;
            text-align: center;
            margin-bottom: 20px;
        }
        .auth-field { margin-bottom: 15px; }
        .auth-field label { display: block; margin-bottom: 5px; color: #003366; font-weight: 500; }
        .auth-field input {
            width: 100%;
            padding: 10px;
            border: 1px solid #e0e6ed;
            border-radius: 6px;
            background: #f8f9fb;
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(to bottom, #0066cc 0%, #003366 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .auth-btn:hover { background: linear-gradient(to bottom, #0088ff 0%, #0055aa 100%); }
        .auth-switch {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 15px;
            background: none;
            border: none;
            color: #0066cc;
            cursor: pointer;
            font-size: 14px;
        }
        .auth-switch:hover { text-decoration: underline; }
        .auth-error {
            background: #ffebee;
            color: #d32f2f;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
        }
        .logout-btn:hover { background: rgba(255, 255, 255, 0.3); }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>
    <!-- Экран загрузки -->
    <div id="authLoading" style="text-align:center; padding-top:100px; font-size:18px; color:#003366;">
        Проверка входа...
    </div>

    <!-- Экран логина -->
    <div id="authScreen" class="auth-container" style="display:none;">
        <div class="auth-title" id="authTitle">Вход</div>
        <div id="authError" class="auth-error"></div>
        
        <div class="auth-field">
            <label>Логин</label>
            <input type="text" id="authUsername" placeholder="Введите логин" maxlength="30">
        </div>
        <div class="auth-field">
            <label>Пароль</label>
            <input type="password" id="authPassword" placeholder="Минимум 6 символов">
        </div>
        
        <button class="auth-btn" id="authSubmitBtn">Войти</button>
        <button class="auth-switch" id="authSwitchBtn">Нет аккаунта? Зарегистрироваться</button>
    </div>

    <!-- Основное приложение -->
    <div id="appContent" style="display:none;">
        <header>
            <div class="logo">Управление эталонами</div>
            <div class="user-info">
                <span id="userNameDisplay"></span>
                <button class="logout-btn" id="logoutBtn">Выйти</button>
            </div>
        </header>

        <div class="controls">
            <button id="createRoom">Создать расположение</button>
            <button id="manageRooms">Управление расположениями</button>
            <button id="openAddStandard">Добавить эталон</button>
        </div>

        <div class="table-container">
            <table id="items">
                <thead>
                    <tr>
                        <th>Наименование</th>
                        <th>Номер</th>
                        <th>Дата метрологической оценки</th>
                        <th>Дата окончания метрологической оценки</th>
                        <th>Вид метрологической оценки</th>
                        <th>Расположение</th>
                        <th>Количество дней до окончания действия</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="overlay" id="overlay"></div>
        <div class="modal" id="addStandardModal">
            <h3 id="modalTitle">Добавить эталон</h3>
            <label for="roomSelect">Расположение:</label>
            <select id="roomSelect" required></select>
            <label for="standardName">Наименование:</label>
            <input type="text" id="standardName" required>
            <label for="standardNumber">Номер:</label>
            <input type="text" id="standardNumber" required>
            <label for="standardDate">Дата:</label>
            <input type="date" id="standardDate" required>
            <label for="interval">Межповерочный интервал (в годах):</label>
            <input type="number" id="interval" required min="1">
            <label for="type">Вид метрологической оценки:</label>
            <select id="type">
                <option value="поверка">Поверка</option>
                <option value="калибровка">Калибровка</option>
            </select>
            <div class="modal-buttons">
                <button id="saveStandard">Сохранить</button>
                <button id="closeModal">Закрыть</button>
            </div>
        </div>

        <div class="modal" id="manageRoomsModal">
            <h3>Управление расположениями</h3>
            <ul id="roomList" style="list-style: none; padding: 0;"></ul>
            <div class="modal-buttons">
                <button id="closeRoomsModal">Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAlMduGeljWyCDj9mje3-ynHiNavAlPC8I",
            authDomain: "vlad-csms-af6df.firebaseapp.com",
            databaseURL: "https://vlad-csms-af6df-default-rtdb.firebaseio.com",
            projectId: "vlad-csms-af6df",
            storageBucket: "vlad-csms-af6df.firebasestorage.app",
            messagingSenderId: "417297799117",
            appId: "1:417297799117:web:07ce2915cbfe0cb1499684",
            measurementId: "G-0EMQB4HYSQ"
        };
        
        // Инициализация Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        const EMAIL_DOMAIN = "@invoice.local";
        let isAuthMode = 'login';
        let standards = [];
        let rooms = [];
        let editingStandardIndex = null;

        // Транслитерация
        const TRANSLIT_MAP = {'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'};
        function transliterate(s) { let r = ''; for (const c of s) { const l = c.toLowerCase(); r += (TRANSLIT_MAP[l] !== undefined) ? TRANSLIT_MAP[l] : c; } return r; }
        function usernameToEmail(u) { const n = u.toLowerCase().trim(); return transliterate(n).replace(/[^a-z0-9._-]/g, '.') + EMAIL_DOMAIN; }
        function validateUsername(u) { const t = u.trim(); if (t.length < 2 || t.length > 30) return false; return /^[а-яёa-z0-9\s._-]+$/i.test(t); }

        // --- ЛОГИКА АВТОРИЗАЦИИ ---
        function showAuthError(msg) {
            const e = document.getElementById('authError');
            e.textContent = msg;
            e.style.display = 'block';
        }

        document.getElementById('authSwitchBtn').addEventListener('click', () => {
            isAuthMode = isAuthMode === 'login' ? 'register' : 'login';
            document.getElementById('authTitle').textContent = isAuthMode === 'login' ? 'Вход' : 'Регистрация';
            document.getElementById('authSubmitBtn').textContent = isAuthMode === 'login' ? 'Войти' : 'Зарегистрироваться';
            document.getElementById('authSwitchBtn').textContent = isAuthMode === 'login' ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
            document.getElementById('authError').style.display = 'none';
        });

        document.getElementById('authSubmitBtn').addEventListener('click', async () => {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value;
            
            if (!username || !password) { showAuthError('Заполните все поля'); return; }
            if (!validateUsername(username)) { showAuthError('Логин: 2-30 символов (буквы, цифры, пробел, . _ -)'); return; }
            if (password.length < 6) { showAuthError('Пароль должен быть минимум 6 символов'); return; }
            
            const btn = document.getElementById('authSubmitBtn');
            btn.disabled = true;
            btn.textContent = 'Загрузка...';
            
            const email = usernameToEmail(username);
            const norm = username.toLowerCase().trim();
            
            try {
                if (isAuthMode === 'login') {
                    await auth.signInWithEmailAndPassword(email, password);
                } else {
                    const cred = await auth.createUserWithEmailAndPassword(email, password);
                    await cred.user.updateProfile({ displayName: username });
                    await database.ref('users/' + cred.user.uid).set({
                        username: norm,
                        displayName: username,
                        name: username,
                        createdAt: new Date().toISOString()
                    });
                    await database.ref('usernames/' + norm).set(cred.user.uid);
                }
            } catch (err) {
                console.error(err);
                const M = {
                    'auth/user-not-found':'Пользователь не найден',
                    'auth/wrong-password':'Неверный пароль',
                    'auth/invalid-credential':'Неверный логин или пароль',
                    'auth/invalid-email':'Некорректный логин',
                    'auth/email-already-in-use':'Логин занят',
                    'auth/weak-password':'Слабый пароль'
                };
                showAuthError(M[err.code] || err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = isAuthMode === 'login' ? 'Войти' : 'Зарегистрироваться';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('Выйти?')) auth.signOut();
        });

        // --- СЛЕЖКА ЗА СОСТОЯНИЕМ ВХОДА И ПРОВЕРКА ОДОБРЕНИЯ ---
        auth.onAuthStateChanged(async user => {
            document.getElementById('authLoading').style.display = 'none';
            
            if (user) {
                let isApproved = false;
                let isAdmin = false;
                
                try {
                    const approvedSnap = await database.ref('approvedUsers/' + user.uid).once('value');
                    isApproved = approvedSnap.exists();
                    
                    const adminSnap = await database.ref('admins/' + user.uid).once('value');
                    isAdmin = adminSnap.val() === true;
                } catch (err) {
                    console.error('Ошибка проверки доступа:', err);
                }

                if (isAdmin) isApproved = true;

                if (!isApproved) {
                    document.getElementById('authScreen').style.display = 'block';
                    document.getElementById('appContent').style.display = 'none';
                    showAuthError('Ваша учётная запись ожидает одобрения администратором. Пожалуйста, свяжитесь с руководством.');
                    return;
                }

                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                document.getElementById('userNameDisplay').textContent = user.displayName || user.email.split('@')[0];
                
                // Запускаем приложение только когда пользователь вошел
                initApp();
            } else {
                document.getElementById('authScreen').style.display = 'block';
                document.getElementById('appContent').style.display = 'none';
            }
        });

        // --- ОСНОВНАЯ ЛОГИКА ПРИЛОЖЕНИЯ ---
        function initApp() {
            // Очищаем предыдущие подписки, если они были
            database.ref('rooms').off();
            database.ref('standards').off();

            function updateRoomSelect() {
                const roomSelect = document.getElementById('roomSelect');
                roomSelect.innerHTML = '';
                rooms.forEach((room, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = room;
                    roomSelect.appendChild(option);
                });
            }

            function fetchRooms() {
                database.ref('rooms').on('value', snapshot => {
                    rooms = snapshot.val() || [];
                    updateRoomSelect();
                    renderRoomList();
                });
            }

            function fetchStandards() {
                database.ref('standards').on('value', snapshot => {
                    standards = snapshot.val() || [];
                    calculateDaysLeft();
                    renderStandards();
                });
            }

            document.getElementById('createRoom').onclick = () => {
                const roomName = prompt('Введите название расположения:');
                if (roomName && roomName.trim() !== '') {
                    rooms.push(roomName);
                    database.ref('rooms').set(rooms);
                    alert(`Расположение "${roomName}" создано!`);
                } else {
                    alert('Название расположения не может быть пустым!');
                }
            };

            document.getElementById('manageRooms').onclick = () => {
                document.getElementById('overlay').style.display = 'block';
                document.getElementById('manageRoomsModal').style.display = 'block';
                renderRoomList();
            };

            function renderRoomList() {
                const roomList = document.getElementById('roomList');
                roomList.innerHTML = '';
                rooms.forEach((room, index) => {
                    const li = document.createElement('li');
                    li.style.padding = '10px';
                    li.style.borderBottom = '1px solid #e0e6ed';
                    li.style.display = 'flex';
                    li.style.justifyContent = 'space-between';
                    li.style.alignItems = 'center';
                    li.textContent = room;
                    li.innerHTML += `
                        <div>
                            <button onclick="editRoom(${index})" style="margin-right: 5px;">Изменить</button>
                            <button onclick="deleteRoom(${index})">Удалить</button>
                        </div>
                    `;
                    roomList.appendChild(li);
                });
            }

            window.editRoom = function(index) {
                const newName = prompt('Введите новое название расположения:', rooms[index]);
                if (newName && newName.trim() !== '') {
                    rooms[index] = newName;
                    database.ref('rooms').set(rooms);
                    renderRoomList();
                    updateRoomSelect();
                } else {
                    alert('Название расположения не может быть пустым!');
                }
            };

            window.deleteRoom = function(index) {
                const isUsed = standards.some(standard => standard.room === rooms[index]);
                if (isUsed) {
                    alert('Нельзя удалить расположение, так как оно используется в эталонах!');
                    return;
                }
                if (confirm('Вы уверены, что хотите удалить расположение?')) {
                    rooms.splice(index, 1);
                    database.ref('rooms').set(rooms);
                    renderRoomList();
                    updateRoomSelect();
                }
            };

            document.getElementById('openAddStandard').onclick = () => {
                if (rooms.length === 0) {
                    alert('Сначала создайте расположение!');
                    return;
                }
                editingStandardIndex = null;
                document.getElementById('modalTitle').textContent = 'Добавить эталон';
                document.getElementById('standardName').value = '';
                document.getElementById('standardNumber').value = '';
                document.getElementById('standardDate').value = '';
                document.getElementById('interval').value = '';
                document.getElementById('type').value = 'поверка';
                document.getElementById('overlay').style.display = 'block';
                document.getElementById('addStandardModal').style.display = 'block';
            };

            document.getElementById('closeModal').onclick = () => {
                document.getElementById('overlay').style.display = 'none';
                document.getElementById('addStandardModal').style.display = 'none';
            };

            document.getElementById('closeRoomsModal').onclick = () => {
                document.getElementById('overlay').style.display = 'none';
                document.getElementById('manageRoomsModal').style.display = 'none';
            };

            document.getElementById('saveStandard').onclick = () => {
                const roomIndex = document.getElementById('roomSelect').value;
                const name = document.getElementById('standardName').value.trim();
                const number = document.getElementById('standardNumber').value.trim();
                const dateInput = new Date(document.getElementById('standardDate').value);
                const interval = parseInt(document.getElementById('interval').value);
                const type = document.getElementById('type').value;

                if (!name || !number || isNaN(interval) || !dateInput || roomIndex === "") {
                    alert('Пожалуйста, заполните все поля!');
                    return;
                }

                const expirationDateInput = new Date(dateInput);
                expirationDateInput.setFullYear(expirationDateInput.getFullYear() + interval);
                expirationDateInput.setDate(expirationDateInput.getDate() - 1);
                const daysLeft = Math.ceil((expirationDateInput - new Date()) / (1000 * 60 * 60 * 24));

                const standard = {
                    name,
                    number,
                    date: dateInput.toISOString(),
                    type,
                    room: rooms[roomIndex],
                    expirationDate: expirationDateInput.toISOString(),
                    daysLeft
                };

                if (editingStandardIndex !== null) {
                    standards[editingStandardIndex] = standard;
                    alert('Эталон изменен!');
                } else {
                    standards.push(standard);
                    alert('Эталон добавлен!');
                }

                database.ref('standards').set(standards);
                calculateDaysLeft();
                renderStandards();
                document.getElementById('overlay').style.display = 'none';
                document.getElementById('addStandardModal').style.display = 'none';
            };

            function calculateDaysLeft() {
                standards.forEach(standard => {
                    const expirationDate = new Date(standard.expirationDate);
                    standard.daysLeft = Math.ceil((expirationDate - new Date()) / (1000 * 60 * 60 * 24));
                });
            }

            function renderStandards() {
                const tbody = document.querySelector('#items tbody');
                tbody.innerHTML = '';
                standards.forEach((standard, index) => {
                    const row = document.createElement('tr');
                    if (standard.daysLeft < 0) {
                        row.classList.add('expired');
                    }
                    row.innerHTML = `
                        <td>${standard.name}</td>
                        <td>${standard.number}</td>
                        <td>${new Date(standard.date).toLocaleDateString()}</td>
                        <td>${new Date(standard.expirationDate).toLocaleDateString()}</td>
                        <td>${standard.type}</td>
                        <td>${standard.room}</td>
                        <td>${standard.daysLeft}</td>
                        <td class="actions">
                            <button onclick="editStandard(${index})">Изменить</button>
                            <button onclick="deleteStandard(${index})">Удалить</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            }

            window.editStandard = function(index) {
                const standard = standards[index];
                document.getElementById('modalTitle').textContent = 'Изменить эталон';
                document.getElementById('standardName').value = standard.name;
                document.getElementById('standardNumber').value = standard.number;
                document.getElementById('standardDate').value = new Date(standard.date).toISOString().split('T')[0];
                document.getElementById('interval').value = (new Date(standard.expirationDate).getFullYear() - new Date(standard.date).getFullYear());
                document.getElementById('type').value = standard.type;
                document.getElementById('roomSelect').value = rooms.indexOf(standard.room);
                editingStandardIndex = index;

                document.getElementById('overlay').style.display = 'block';
                document.getElementById('addStandardModal').style.display = 'block';
            };

            window.deleteStandard = function(index) {
                if (confirm('Вы уверены, что хотите удалить эталон?')) {
                    standards.splice(index, 1);
                    database.ref('standards').set(standards);
                    renderStandards();
                }
            };

            // Запуск загрузки данных
            fetchRooms();
            fetchStandards();
        }
    </script>
</body>
</html>
