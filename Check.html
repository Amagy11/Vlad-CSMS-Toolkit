<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка свидетельств БелГИМ</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; max-width: 1100px; margin: 20px auto; padding: 0 15px; }
        .card { background: #fff; border-radius: 12px; padding: 25px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        h2 { margin: 0 0 15px 0; }
        
        .upload-zone {
            border: 2px dashed #aaa;
            border-radius: 12px;
            padding: 35px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            margin: 15px 0;
        }
        .upload-zone:hover { border-color: #0d6efd; background: #f8f9ff; }
        .upload-zone.loaded { border-color: #198754; background: #f0fff4; }
        
        .progress-wrap { margin: 15px 0; display: none; }
        .progress-wrap.active { display: block; }
        .progress-bar { width: 100%; height: 24px; background: #e9ecef; border-radius: 12px; overflow: hidden; }
        .progress-fill { height: 100%; background: #0d6efd; color: #fff; text-align: center; line-height: 24px; font-size: 13px; transition: width 0.3s; }
        
        table { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 15px; }
        th, td { border: 1px solid #dee2e6; padding: 8px; }
        th { background: #1a1a2e; color: #fff; position: sticky; top: 0; }
        .ok { background: #d4edda; } .err { background: #f8d7da; }
        
        button { padding: 10px 24px; font-size: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-primary { background: #0d6efd; color: #fff; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn-success { background: #198754; color: #fff; }
        
        .stats { display: flex; gap: 12px; flex-wrap: wrap; margin: 15px 0; }
        .stat { padding: 6px 16px; border-radius: 20px; font-weight: 600; font-size: 13px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🔍 Проверка свидетельств через ГРСИ БелГИМ</h2>
        <p style="color:#666;">Загрузите CSV-файл — система автоматически сверит с реестром</p>
        
        <div id="uploadZone" class="upload-zone">
            <div style="font-size: 42px;">📄</div>
            <div style="font-weight:600;">Загрузите файл</div>
            <div style="font-size:12px;color:#999;">.csv, .xlsx, .xls</div>
            <div id="fileInfo" style="display:none;color:#198754;font-weight:600;margin-top:8px;"></div>
        </div>
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none;">
        
        <button id="checkBtn" class="btn-primary" disabled>🔍 Проверить</button>
        <span id="status" style="margin-left:12px;color:#666;"></span>
        
        <div class="progress-wrap" id="progressWrap">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width:0%;">0%</div>
            </div>
        </div>
    </div>
    
    <div id="results"></div>

<script>
let csvData = [];
let cols = {};

// Drag & Drop + клик
const zone = document.getElementById('uploadZone');
const input = document.getElementById('fileInput');

zone.addEventListener('click', () => input.click());
zone.addEventListener('dragover', e => { e.preventDefault(); zone.style.borderColor = '#0d6efd'; });
zone.addEventListener('dragleave', () => zone.style.borderColor = '#aaa'; });
zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.style.borderColor = '#aaa';
    input.files = e.dataTransfer.files;
    input.dispatchEvent(new Event('change'));
});

// Загрузка CSV
input.addEventListener('change', function() {
    const file = this.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    const ext = file.name.split('.').pop().toLowerCase();
    
    reader.onload = function(ev) {
        const wb = XLSX.read(
            ext === 'csv' ? ev.target.result : new Uint8Array(ev.target.result),
            { type: ext === 'csv' ? 'string' : 'array', raw: true }
        );
        csvData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
        
        const headers = Object.keys(csvData[0]);
        cols.name = headers.find(h => /наименование|тип си|название/i.test(h));
        cols.registry = headers.find(h => /грси|госреестр|реестр/i.test(h));
        cols.sut = headers.find(h => /сут|идентифика|заводской/i.test(h));
        
        if (!cols.name || !cols.registry) {
            alert('Нужны колонки: Наименование СИ, Номер ГРСИ\nНайдено: ' + headers.join(', '));
            return;
        }
        
        zone.classList.add('loaded');
        document.getElementById('fileInfo').style.display = 'block';
        document.getElementById('fileInfo').textContent = `✅ ${file.name} — ${csvData.length} строк`;
        document.getElementById('checkBtn').disabled = false;
    };
    
    ext === 'csv' ? reader.readAsText(file, 'UTF-8') : reader.readAsArrayBuffer(file);
});

// Проверка
document.getElementById('checkBtn').addEventListener('click', async function() {
    const btn = this;
    const progressWrap = document.getElementById('progressWrap');
    const progressFill = document.getElementById('progressFill');
    const status = document.getElementById('status');
    const resultsDiv = document.getElementById('results');
    
    btn.disabled = true;
    resultsDiv.innerHTML = '';
    progressWrap.classList.add('active');
    
    try {
        // Загружаем данные ГРСИ через Puppeteer
        status.textContent = 'Загружаем реестр ГРСИ...';
        progressFill.style.width = '30%';
        progressFill.textContent = 'Загрузка реестра...';
        
        const res = await fetch('/api/proxy');
        const json = await res.json();
        
        if (json.error) throw new Error(json.error);
        
        // Строим индекс
        const grsiMap = {};
        for (const item of json.data) {
            if (item.registry) grsiMap[item.registry] = item.name;
        }
        
        // Сравниваем
        const total = csvData.length;
        let found = 0, notFound = 0;
        let html = '<div class="card"><div class="stats">';
        
        let rowsHtml = '';
        
        for (let i = 0; i < total; i++) {
            const row = csvData[i];
            const n = String(row[cols.name] || '').trim();
            const r = String(row[cols.registry] || '').trim();
            const s = cols.sut ? String(row[cols.sut] || '').trim() : '';
            
            const pct = 30 + Math.round(((i + 1) / total) * 70);
            progressFill.style.width = pct + '%';
            progressFill.textContent = `${i + 1}/${total}`;
            
            if (grsiMap[r]) {
                found++;
                rowsHtml += `<tr class="ok"><td>${i+1}</td><td>${esc(n)}</td><td>${esc(r)}</td><td>${esc(s)}</td><td>✅ Найдено</td><td>${esc(grsiMap[r])}</td></tr>`;
            } else {
                notFound++;
                rowsHtml += `<tr class="err"><td>${i+1}</td><td>${esc(n)}</td><td>${esc(r)}</td><td>${esc(s)}</td><td>❌ Не найдено</td><td>—</td></tr>`;
            }
        }
        
        html += `<span class="stat" style="background:#d4edda;color:#0f5132;">✅ ${found}</span>`;
        html += `<span class="stat" style="background:#f8d7da;color:#842029;">❌ ${notFound}</span>`;
        html += `<span class="stat" style="background:#e9ecef;">📊 ${total}</span>`;
        html += `<button class="btn-success" onclick="downloadResult()" style="margin-left:auto;">⬇ Скачать</button>`;
        html += '</div>';
        html += '<div style="max-height:65vh;overflow-y:auto;"><table>';
        html += '<tr><th>№</th><th>Наименование</th><th>ГРСИ</th><th>СУТ</th><th>Статус</th><th>В реестре</th></tr>';
        html += rowsHtml;
        html += '</table></div></div>';
        
        resultsDiv.innerHTML = html;
        progressFill.style.width = '100%';
        progressFill.textContent = 'Готово';
        status.textContent = `✅ ${found} найдено, ${notFound} не найдено`;
        
        // Для скачивания
        window._result = { csvData, cols, grsiMap };
        
    } catch(e) {
        status.textContent = '❌ ' + e.message;
        alert('Ошибка: ' + e.message);
    }
    
    btn.disabled = false;
});

function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

function downloadResult() {
    const { csvData, cols, grsiMap } = window._result || {};
    if (!csvData) return;
    
    const rows = [['№', 'Наименование (CSV)', 'ГРСИ (CSV)', 'СУТ', 'Наименование (ГРСИ)', 'Статус']];
    csvData.forEach((row, i) => {
        const r = String(row[cols.registry] || '').trim();
        rows.push([i+1, String(row[cols.name]||'').trim(), r, cols.sut?String(row[cols.sut]||'').trim():'', grsiMap[r]||'—', grsiMap[r]?'Найдено':'Не найдено']);
    });
    
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Результат');
    XLSX.writeFile(wb, 'результат.xlsx');
}
</script>

</body>
</html>
