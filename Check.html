<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Загрузка эталона</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { background: #f0f2f5; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        .upload-zone {
            border: 3px dashed #adb5bd;
            border-radius: 14px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            background: #ffffff;
            transition: all 0.3s ease;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .upload-zone:hover { border-color: #0d6efd; background: #f8f9ff; }
        .upload-zone.dragover { border-color: #0d6efd; background: #e7edff; }
        .upload-zone.loaded { border-color: #198754; background: #f0fff4; border-style: solid; }
        .upload-zone .icon { font-size: 48px; margin-bottom: 8px; }
        .upload-zone .hint { font-size: 14px; color: #6c757d; margin-top: 4px; }
        .upload-zone .upload-text { font-weight: 500; font-size: 16px; }
        .upload-zone .loaded-info { display: none; text-align: center; width: 100%; }
        .upload-zone.loaded .icon { display: none; }
        .upload-zone.loaded .upload-text { display: none; }
        .upload-zone.loaded .hint { display: none; }
        .upload-zone.loaded .loaded-info { display: block; }
        .upload-zone .loaded-info .file-icon { font-size: 36px; display: block; }
        .upload-zone .loaded-info .file-name { font-weight: 600; font-size: 15px; color: #1a1a2e; }
        .upload-zone .loaded-info .file-stats { font-size: 13px; color: #6c757d; }
        
        .modal-content { border-radius: 14px; }
        .modal-header { background: #1a1a2e; color: #fff; border-radius: 14px 14px 0 0; }
        .modal-header .btn-close { filter: invert(1); }
        .table-wrap { max-height: 500px; overflow-y: auto; }
        .table-wrap table { font-size: 13px; margin-bottom: 0; }
        .table-wrap th { position: sticky; top: 0; background: #1a1a2e; color: #fff; z-index: 10; padding: 10px 12px; white-space: nowrap; }
        .table-wrap td { padding: 8px 12px; vertical-align: middle; }
        .table-wrap tr:hover td { background: #f8f9ff; }
        
        .summary-box { background: #fff; border-radius: 12px; padding: 20px 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .btn-preview { border-radius: 10px; padding: 8px 20px; font-weight: 600; }
        
        .col-tag { display: inline-block; background: #e9ecef; padding: 2px 12px; border-radius: 12px; font-size: 12px; margin: 2px 4px 2px 0; }
        .col-tag strong { color: #0d6efd; }
        
        .file-list { margin-top: 12px; }
        .file-list .file-item { display: inline-block; background: #e9ecef; padding: 4px 14px; border-radius: 20px; font-size: 13px; margin: 3px 6px 3px 0; }
        
        @media (max-width: 768px) {
            .upload-zone { min-height: 150px; padding: 20px; }
            .table-wrap td { font-size: 12px; padding: 6px 8px; }
            body { padding: 12px; }
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="d-flex align-items-center gap-3 mb-4 flex-wrap">
        <div>
            <h1 style="font-weight:700; color:#1a1a2e;">📂 Загрузка эталона</h1>
            <p style="color:#6c757d;">Загрузите файлы. Система сама найдёт колонки: <strong>тип СИ</strong>, <strong>Модификация</strong>, <strong>номер ГРСИ</strong>, <strong>номер СУТ</strong></p>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="summary-box">
                <!-- Зона загрузки -->
                <div id="uploadZone" class="upload-zone">
                    <div class="icon">📦</div>
                    <div class="upload-text">Нажмите или перетащите файлы</div>
                    <div class="hint">.xlsx, .xls или .csv (можно несколько)</div>
                    <div class="loaded-info">
                        <span class="file-icon">✅</span>
                        <div class="file-name" id="loadedName">файлы загружены</div>
                        <div class="file-stats" id="loadedStats">0 строк</div>
                    </div>
                </div>
                <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" multiple style="display:none;" />

                <!-- Информация о загруженных файлах -->
                <div id="fileInfo" style="display:none; margin-top: 12px;">
                    <div class="file-list" id="fileList"></div>
                    <div style="margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
                        <button id="previewBtn" class="btn btn-primary btn-preview" disabled>
                            👁️ Просмотр таблицы
                        </button>
                        <span style="font-size:13px; color:#6c757d;">
                            Найдено колонок: <span id="foundColsCount">0</span>/4
                        </span>
                    </div>
                    <div style="margin-top: 6px; font-size:12px; color:#6c757d;" id="colsInfo"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно для просмотра таблицы -->
<div class="modal fade" id="previewModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">📊 Данные эталона</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div style="margin-bottom: 12px; font-size:14px; color:#6c757d;">
                    Показаны только найденные колонки: 
                    <span id="modalColsNames"></span>
                    <span class="badge bg-secondary ms-2" id="modalRowCount">0 строк</span>
                </div>
                <div class="table-wrap">
                    <table class="table table-bordered table-striped" id="previewTable">
                        <thead id="previewHead"></thead>
                        <tbody id="previewBody"></tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
            </div>
        </div>
    </div>
</div>

<script>
// ============================================================
//  НАСТРОЙКА: какие колонки ищем (гибкий поиск)
// ============================================================
const SEARCH_RULES = {
    'type': {
        keywords: ['тип си', 'тип', 'наименование си', 'наименование', 'название', 'средство', 'прибор'],
        displayName: 'тип СИ'
    },
    'modification': {
        keywords: ['модификация', 'исполнение', 'модификаци', 'модель', 'версия', 'исполн'],
        displayName: 'Модификация'
    },
    'registry': {
        keywords: ['номер грси', 'грси', 'номер госреестра си', 'рег. номер', 'регистрационный номер', 'госреестр'],
        displayName: 'номер ГРСИ'
    },
    'sut': {
        keywords: ['номер сут', 'сут', 'идентификационный номер', 'идентификатор', 'заводской номер', 'серийный номер'],
        displayName: 'номер СУТ'
    }
};

// ============================================================
//  ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
// ============================================================
let allData = [];
let allHeaders = [];
let foundColumns = {};
let fileNames = [];

// ============================================================
//  ПОИСК КОЛОНОК (гибкий, по ключевым словам)
// ============================================================
function findColumns(headers) {
    const detected = {};
    const usedColumns = new Set();

    for (let [key, rule] of Object.entries(SEARCH_RULES)) {
        let found = null;
        let bestScore = 0;
        
        for (let h of headers) {
            if (usedColumns.has(h)) continue;
            const lower = h.toLowerCase().trim();
            
            for (let kw of rule.keywords) {
                // Проверяем, содержит ли заголовок ключевое слово
                if (lower.includes(kw) || kw.includes(lower)) {
                    const score = Math.max(kw.length, lower.length);
                    if (score > bestScore) {
                        bestScore = score;
                        found = h;
                    }
                }
            }
        }
        
        if (found) {
            detected[key] = found;
            usedColumns.add(found);
        }
    }
    
    return detected;
}

// ============================================================
//  ЧТЕНИЕ ФАЙЛОВ
// ============================================================
function readFiles(files) {
    return new Promise((resolve) => {
        const allData = [];
        let headers = [];
        let completed = 0;
        
        if (!files || files.length === 0) {
            resolve({ data: [], headers: [], fileNames: [] });
            return;
        }

        const fileNames = Array.from(files).map(f => f.name);

        for (let file of files) {
            const reader = new FileReader();
            const format = file.name.split('.').pop().toLowerCase();
            
            reader.onload = function(e) {
                try {
                    let json = [];
                    if (format === 'csv') {
                        const text = e.target.result;
                        const workbook = XLSX.read(text, { type: 'string', raw: true, codepage: 65001 });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        json = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });
                    } else {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        json = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });
                    }
                    
                    if (json.length > 0) {
                        if (headers.length === 0) {
                            headers = Object.keys(json[0]);
                        }
                        allData.push(...json);
                    }
                } catch (err) {
                    console.error('Ошибка чтения:', file.name, err);
                }
                completed++;
                if (completed === files.length) {
                    resolve({ data: allData, headers: headers, fileNames: fileNames });
                }
            };
            
            if (format === 'csv') {
                reader.readAsText(file, 'UTF-8');
            } else {
                reader.readAsArrayBuffer(file);
            }
        }
    });
}

// ============================================================
//  ЗАГРУЗКА ФАЙЛОВ
// ============================================================
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const previewBtn = document.getElementById('previewBtn');

uploadZone.addEventListener('click', () => fileInput.click());

uploadZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadZone.classList.add('dragover');
});

uploadZone.addEventListener('dragleave', () => {
    uploadZone.classList.remove('dragover');
});

uploadZone.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) {
        fileInput.files = e.dataTransfer.files;
        fileInput.dispatchEvent(new Event('change'));
    }
});

fileInput.addEventListener('change', async function() {
    if (this.files.length === 0) return;
    await loadFiles(this.files);
    this.value = '';
});

// ============================================================
//  ЗАГРУЗКА И ОБРАБОТКА
// ============================================================
async function loadFiles(files) {
    const result = await readFiles(files);
    allData = result.data;
    allHeaders = result.headers;
    fileNames = result.fileNames;
    
    if (allData.length === 0) {
        alert('Не удалось прочитать файлы или они пусты.');
        return;
    }
    
    // Ищем нужные колонки (гибкий поиск)
    foundColumns = findColumns(allHeaders);
    
    // Показываем информацию
    document.getElementById('fileInfo').style.display = 'block';
    uploadZone.classList.add('loaded');
    
    document.getElementById('loadedName').textContent = 
        fileNames.length === 1 ? fileNames[0] : `${fileNames.length} файлов`;
    document.getElementById('loadedStats').textContent = `${allData.length} строк`;
    
    // Список файлов
    document.getElementById('fileList').innerHTML = fileNames.map(name => 
        `<span class="file-item">📄 ${name}</span>`
    ).join('');
    
    // Информация о найденных колонках
    const foundKeys = Object.keys(foundColumns);
    document.getElementById('foundColsCount').textContent = foundKeys.length;
    
    const colsInfo = document.getElementById('colsInfo');
    if (foundKeys.length === 4) {
        colsInfo.innerHTML = '✅ Найдены все колонки: ' + 
            foundKeys.map(key => `<span class="col-tag"><strong>${SEARCH_RULES[key].displayName}</strong> → "${foundColumns[key]}"</span>`).join('');
        colsInfo.style.color = '#198754';
    } else {
        const missing = Object.keys(SEARCH_RULES).filter(k => !foundColumns[k]);
        colsInfo.innerHTML = '⚠️ Найдено ' + foundKeys.length + ' из 4 колонок. Не найдены: ' + 
            missing.map(k => `<strong>${SEARCH_RULES[k].displayName}</strong>`).join(', ');
        colsInfo.style.color = '#dc3545';
    }
    
    // Активируем кнопку просмотра (если найдена хотя бы одна колонка)
    previewBtn.disabled = foundKeys.length === 0;
}

// ============================================================
//  ПРОСМОТР ТАБЛИЦЫ
// ============================================================
previewBtn.addEventListener('click', function() {
    if (allData.length === 0 || Object.keys(foundColumns).length === 0) {
        alert('Нет данных для отображения');
        return;
    }
    
    // Берём только найденные колонки в правильном порядке
    const order = ['type', 'modification', 'registry', 'sut'];
    const displayCols = order.filter(k => foundColumns[k]);
    const displayNames = displayCols.map(k => SEARCH_RULES[k].displayName);
    
    // Заголовки
    const thead = document.getElementById('previewHead');
    thead.innerHTML = `<tr>${displayNames.map(name => `<th>${name}</th>`).join('')}</tr>`;
    
    // Данные
    const tbody = document.getElementById('previewBody');
    let html = '';
    for (let row of allData) {
        const cells = displayCols.map(key => {
            const colName = foundColumns[key];
            const value = row[colName] !== undefined ? row[colName] : '';
            return `<td>${value}</td>`;
        });
        html += `<tr>${cells.join('')}</tr>`;
    }
    tbody.innerHTML = html;
    
    // Информация в модалке
    document.getElementById('modalColsNames').innerHTML = displayNames.map(name => 
        `<span class="badge bg-primary">${name}</span>`
    ).join(' ');
    document.getElementById('modalRowCount').textContent = allData.length + ' строк';
    
    // Показываем модалку
    const modal = new bootstrap.Modal(document.getElementById('previewModal'));
    modal.show();
});

console.log('✅ Сайт готов! Загрузите файлы — система сама найдёт нужные колонки.');
console.log('🔍 Поиск по ключевым словам:', SEARCH_RULES);
</script>

<!-- Подключаем Bootstrap JS для модалки -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
