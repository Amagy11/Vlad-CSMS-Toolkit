<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Проверка свидетельств</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1000px; margin: 20px auto; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; font-size: 12px; }
        th { background: #333; color: #fff; }
        .ok { background: #d4edda; }
        .err { background: #f8d7da; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin-left: 10px; }
        #status { margin-left: 10px; color: #666; }
    </style>
</head>
<body>

    <h2>Проверка свидетельств через реестры БелГИМ</h2>
    <p>Сверяет данные с <a href="https://www.oei.by/grsi" target="_blank">ГРСИ</a> и <a href="https://www.oei.by/sssr/index" target="_blank">СССР/СНГ</a></p>
    
    <input type="file" id="fileInput" accept=".xlsx,.xls">
    <button id="checkBtn" disabled>Проверить</button>
    <span id="status"></span>
    
    <div id="results"></div>

<script>
const PROXY = 'https://api.allorigins.win/raw?url=';

let data = [];
let cols = {};

// Загрузка Excel
document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(ev) {
        const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        data = XLSX.utils.sheet_to_json(sheet, { defval: '' });
        
        if (data.length === 0) return alert('Файл пуст');
        
        const headers = Object.keys(data[0]);
        cols.name = headers.find(h => /наименование|тип си|название/i.test(h));
        cols.registry = headers.find(h => /грси|госреестр|рег.*номер|номер.*гос/i.test(h));
        cols.sut = headers.find(h => /сут|идентифика|тип/i.test(h));
        
        if (!cols.name || !cols.registry || !cols.sut) {
            alert('Не найдены колонки. Заголовки: ' + headers.join(', '));
            return;
        }
        
        document.getElementById('checkBtn').disabled = false;
        document.getElementById('status').textContent = `✅ Загружено: ${data.length} строк`;
    };
    reader.readAsArrayBuffer(file);
});

// Парсинг ГРСИ
async function loadGrsi() {
    const html = await fetch(PROXY + encodeURIComponent('https://www.oei.by/grsi')).then(r => r.text());
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const table = doc.querySelector('table');
    const result = {};
    
    if (table) {
        const rows = table.querySelectorAll('tr');
        for (let i = 1; i < rows.length; i++) {
            const cells = rows[i].querySelectorAll('td');
            if (cells.length >= 4) {
                result[cells[3].textContent.trim()] = {
                    name: cells[0].textContent.trim(),
                    type: cells[2].textContent.trim()
                };
            }
        }
    }
    return result;
}

// Поиск в СССР/СНГ
async function searchSssr(name, registry) {
    try {
        // Пробуем через форму поиска
        const formData = new URLSearchParams();
        formData.append('name', name);
        formData.append('number', registry);
        
        const html = await fetch(PROXY + encodeURIComponent('https://www.oei.by/sssr/index'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData.toString()
        }).then(r => r.text());
        
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const table = doc.querySelector('table');
        
        if (!table) return { found: false };
        
        const rows = table.querySelectorAll('tr');
        const results = [];
        for (let i = 1; i < rows.length; i++) {
            const cells = rows[i].querySelectorAll('td');
            if (cells.length >= 2) {
                results.push({
                    name: cells[0].textContent.trim(),
                    info: cells[1].textContent.trim()
                });
            }
        }
        
        return { found: results.length > 0, results };
    } catch(e) {
        return { found: false, error: e.message };
    }
}

// Проверка
document.getElementById('checkBtn').addEventListener('click', async function() {
    const status = document.getElementById('status');
    const resultsDiv = document.getElementById('results');
    const btn = document.getElementById('checkBtn');
    
    btn.disabled = true;
    resultsDiv.innerHTML = '';
    
    // Загружаем ГРСИ один раз
    status.textContent = '⏳ Загружаем ГРСИ...';
    const grsiData = await loadGrsi();
    
    let html = '<table><tr><th>№</th><th>Наименование</th><th>ГРСИ</th><th>СУТ</th><th>ГРСИ</th><th>СССР/СНГ</th></tr>';
    
    for (let i = 0; i < data.length; i++) {
        const row = data[i];
        const rowName = String(row[cols.name] || '').trim();
        const rowReg = String(row[cols.registry] || '').trim();
        const rowSut = String(row[cols.sut] || '').trim();
        
        status.textContent = `⏳ Проверяем ${i + 1} из ${data.length}...`;
        
        let grsiResult = '';
        let sssrResult = '';
        let rowClass = '';
        
        // 1. Проверяем ГРСИ
        if (grsiData[rowReg]) {
            const gr = grsiData[rowReg];
            grsiResult = `✅ ${gr.name} / ${gr.type}`;
            rowClass = 'ok';
        } else {
            grsiResult = '❌ Не найден';
            
            // 2. Если в ГРСИ нет — ищем в СССР
            const sssr = await searchSssr(rowName, rowReg);
            await new Promise(r => setTimeout(r, 300)); // Задержка между запросами
            
            if (sssr.found) {
                sssrResult = `✅ Найдено: ${sssr.results.length} зап.`;
                rowClass = 'ok';
            } else if (sssr.error) {
                sssrResult = `⚠️ ${sssr.error}`;
                rowClass = 'err';
            } else {
                sssrResult = '❌ Не найден';
                rowClass = 'err';
            }
        }
        
        html += `<tr class="${rowClass}">
            <td>${i + 1}</td>
            <td>${rowName}</td>
            <td>${rowReg}</td>
            <td>${rowSut}</td>
            <td>${grsiResult}</td>
            <td>${sssrResult || '—'}</td>
        </tr>`;
    }
    
    html += '</table>';
    resultsDiv.innerHTML = html;
    status.textContent = '✅ Готово';
    btn.disabled = false;
});
</script>

</body>
</html>
