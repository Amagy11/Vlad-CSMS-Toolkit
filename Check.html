<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Проверка ГРСИ</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: Arial; max-width: 900px; margin: 20px auto; }
        textarea { width: 100%; height: 150px; font-size: 12px; }
        table { border-collapse: collapse; width: 100%; margin-top: 15px; }
        td, th { border: 1px solid #ccc; padding: 5px; font-size: 12px; }
        .ok { background: #d4edda; } .err { background: #f8d7da; }
        button { padding: 8px 16px; margin: 5px; cursor: pointer; }
        .step { background: #f8f9fa; padding: 12px; border-radius: 8px; margin: 10px 0; }
    </style>
</head>
<body>

    <h3>Проверка свидетельств через ГРСИ</h3>
    
    <div class="step">
        <b>Шаг 1.</b> Открой <a href="https://www.oei.by/grsi" target="_blank">oei.by/grsi</a> → выдели ВСЮ таблицу (Ctrl+A) → скопируй (Ctrl+C) → вставь сюда (Ctrl+V):<br>
        <textarea id="grsiText" placeholder="Вставь таблицу..."></textarea>
        <button onclick="loadGrsi()">Загрузить ГРСИ</button> <span id="grsiOk"></span>
    </div>
    
    <div class="step">
        <b>Шаг 2.</b> Загрузи свой CSV/Excel:<br>
        <input type="file" id="csvFile" accept=".csv,.xlsx,.xls">
        <span id="csvOk"></span>
    </div>
    
    <div class="step">
        <b>Шаг 3.</b> <button onclick="check()" id="checkBtn" disabled>Проверить</button>
        <span id="checkOk"></span>
    </div>
    
    <div id="result"></div>

<script>
let grsi = {}; // "номер ГРСИ" → "наименование"
let rows = [];

function loadGrsi() {
    const text = document.getElementById('grsiText').value.trim();
    if (!text) return alert('Вставь таблицу!');
    
    const lines = text.split('\n').filter(l => l.trim());
    
    // Пробуем табуляцию
    let delimiter = '\t';
    if (lines[0].split('\t').length < 4) {
        // Если табуляция не подошла — пробуем 2+ пробела
        delimiter = /\s{2,}/;
    }
    
    grsi = {};
    let found = 0;
    
    for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(delimiter);
        if (cols.length >= 4) {
            const regNum = cols[3].trim();
            const name = cols[1].trim();
            if (regNum && regNum.match(/\d/)) {
                grsi[regNum] = name;
                found++;
            }
        }
    }
    
    document.getElementById('grsiOk').textContent = `✅ ${found} записей`;
    document.getElementById('checkBtn').disabled = !(found > 0 && rows.length > 0);
    
    // Покажем примеры для проверки
    const keys = Object.keys(grsi).slice(0, 3);
    console.log('ГРСИ (первые 3):', keys.map(k => `${k} → ${grsi[k]}`));
}

document.getElementById('csvFile').onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    const ext = file.name.split('.').pop().toLowerCase();
    
    reader.onload = function(ev) {
        try {
            const wb = XLSX.read(
                ext === 'csv' ? ev.target.result : new Uint8Array(ev.target.result),
                { type: ext === 'csv' ? 'string' : 'array', raw: true }
            );
            const sheet = wb.Sheets[wb.SheetNames[0]];
            rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
            
            if (!rows.length) return alert('Файл пуст');
            
            document.getElementById('csvOk').textContent = `✅ ${rows.length} строк`;
            document.getElementById('checkBtn').disabled = !(Object.keys(grsi).length > 0);
        } catch(err) {
            alert('Ошибка: ' + err.message);
        }
    };
    
    if (ext === 'csv') reader.readAsText(file, 'UTF-8');
    else reader.readAsArrayBuffer(file);
};

function check() {
    const headers = Object.keys(rows[0]);
    const nameCol = headers.find(h => /наименование|тип си|название/i.test(h));
    const regCol = headers.find(h => /грси|госреестр|реестр|рег.*номер/i.test(h));
    const sutCol = headers.find(h => /сут|идентифика|заводской|серийный/i.test(h));
    
    if (!nameCol || !regCol) return alert('Не найдены колонки: Наименование, ГРСИ');
    
    let html = '<table><tr><th>№</th><th>Наименование</th><th>ГРСИ</th><th>СУТ</th><th>Статус</th><th>В ГРСИ</th></tr>';
    let ok = 0, err = 0;
    
    for (let i = 0; i < rows.length; i++) {
        const n = String(rows[i][nameCol] || '').trim();
        const r = String(rows[i][regCol] || '').trim();
        const s = sutCol ? String(rows[i][sutCol] || '').trim() : '';
        const found = grsi[r];
        
        if (found) {
            ok++;
            html += `<tr class="ok"><td>${i+1}</td><td>${n}</td><td>${r}</td><td>${s}</td><td>✅</td><td>${found}</td></tr>`;
        } else {
            err++;
            html += `<tr class="err"><td>${i+1}</td><td>${n}</td><td>${r}</td><td>${s}</td><td>❌</td><td>—</td></tr>`;
        }
    }
    
    html += '</table>';
    document.getElementById('result').innerHTML = 
        `<p><b>✅ Найдено: ${ok} | ❌ Не найдено: ${err}</b></p>` + html;
    document.getElementById('checkOk').textContent = 'Готово';
}
</script>

</body>
</html>
