<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расчет Погрешности</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: white;
            background-color: #4169E1;
            padding: 16px;
            border-radius: 8px;
            width: 100%;
            text-align: center;
        }
        .input-group {
            margin: 16px 0;
        }
        input[type="number"] {
            padding: 10px;
            border: 1px solid #4169E1;
            border-radius: 8px;
            width: 200px;
        }
        button {
            padding: 10px;
            background-color: #4169E1;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-left: 10px;
        }
        button:hover {
            background-color: #365dcf;
        }
        table {
            width: 90%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #fff;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }
        .result {
            margin-top: 20px;
            background-color: #e3f2fd;
            padding: 10px;
            border-radius: 8px;
            width: 90%;
        }
        .color-indicator {
            display: flex;
            align-items: center;
        }
        .color-indicator div {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .green { background-color: #008000; }
        .orange { background-color: #FFA500; }
        .red { background-color: #FF0000; }

        /* --- Стили для логина --- */
        .auth-container {
            max-width: 400px;
            margin: 50px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 34, 68, 0.15);
        }
        .auth-title {
            font-size: 24px;
            font-weight: bold;
            color: #003366;
            text-align: center;
            margin-bottom: 20px;
        }
        .auth-field { margin-bottom: 15px; }
        .auth-field label { display: block; margin-bottom: 5px; color: #003366; font-weight: 500; }
        .auth-field input {
            width: 100%;
            padding: 10px;
            border: 1px solid #e0e6ed;
            border-radius: 6px;
            background: #f8f9fb;
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(to bottom, #0066cc 0%, #003366 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .auth-btn:hover { background: linear-gradient(to bottom, #0088ff 0%, #0055aa 100%); }
        .auth-switch {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 15px;
            background: none;
            border: none;
            color: #0066cc;
            cursor: pointer;
            font-size: 14px;
        }
        .auth-switch:hover { text-decoration: underline; }
        .auth-error {
            background: #ffebee;
            color: #d32f2f;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
        }
        .logout-btn:hover { background: rgba(255, 255, 255, 0.3); }
    </style>
    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>

    <!-- Экран загрузки -->
    <div id="authLoading" style="text-align:center; padding-top:100px; font-size:18px; color:#003366;">
        Проверка входа...
    </div>

    <!-- Экран логина -->
    <div id="authScreen" class="auth-container" style="display:none;">
        <div class="auth-title" id="authTitle">Вход</div>
        <div id="authError" class="auth-error"></div>
        
        <div class="auth-field">
            <label>Логин</label>
            <input type="text" id="authUsername" placeholder="Введите логин" maxlength="30">
        </div>
        <div class="auth-field">
            <label>Пароль</label>
            <input type="password" id="authPassword" placeholder="Минимум 6 символов">
        </div>
        
        <button class="auth-btn" id="authSubmitBtn">Войти</button>
        <button class="auth-switch" id="authSwitchBtn">Нет аккаунта? Зарегистрироваться</button>
    </div>

    <!-- Основной контент (скрыт до входа) -->
    <div id="appContent" style="display:none; width:100%; display:flex; flex-direction:column; align-items:center;">
        <div class="user-info" style="align-self:flex-end; margin-bottom:10px;">
            <span id="userNameDisplay"></span>
            <button class="logout-btn" id="logoutBtn">Выйти</button>
        </div>

        <h1>Расчет Погрешности Скорости</h1>
        <div class="input-group">
            <input type="number" id="codelSpeed" placeholder="Введите скорость Codel" />
            <button id="addCodel">Добавить Codel</button>
        </div>
        <div class="input-group">
            <input type="number" id="referenceSpeed" placeholder="Введите скорость Эталона" />
            <button id="setReference">Установить Эталон</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Codel</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="dataTable"></tbody>
        </table>
        <div class="result">
            <h3>Средняя скорость Codel: <span id="averageCodel">0</span></h3>
            <h3>Средняя скорость Эталон: <span id="averageReference">0</span></h3>
            <h3 id="errorDisplay">Погрешность: <span id="errorPercentage">0</span>%</h3>
            <h3>Формула: <span id="formulaDisplay"></span></h3>
        </div>
    </div>

    <script>
        // Конфигурация Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAlMduGeljWyCDj9mje3-ynHiNavAlPC8I",
            authDomain: "vlad-csms-af6df.firebaseapp.com",
            databaseURL: "https://vlad-csms-af6df-default-rtdb.firebaseio.com",
            projectId: "vlad-csms-af6df",
            storageBucket: "vlad-csms-af6df.firebasestorage.app",
            messagingSenderId: "417297799117",
            appId: "1:417297799117:web:07ce2915cbfe0cb1499684",
            measurementId: "G-0EMQB4HYSQ"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        const EMAIL_DOMAIN = "@invoice.local";
        let isAuthMode = 'login';
        let currentUser = null;

        // Транслитерация
        const TRANSLIT_MAP = {'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'};
        function transliterate(s) { let r = ''; for (const c of s) { const l = c.toLowerCase(); r += (TRANSLIT_MAP[l] !== undefined) ? TRANSLIT_MAP[l] : c; } return r; }
        function usernameToEmail(u) { const n = u.toLowerCase().trim(); return transliterate(n).replace(/[^a-z0-9._-]/g, '.') + EMAIL_DOMAIN; }
        function validateUsername(u) { const t = u.trim(); if (t.length < 2 || t.length > 30) return false; return /^[а-яёa-z0-9\s._-]+$/i.test(t); }

        // --- ЛОГИКА АВТОРИЗАЦИИ ---
        function showAuthError(msg) {
            const e = document.getElementById('authError');
            e.textContent = msg;
            e.style.display = 'block';
        }

        document.getElementById('authSwitchBtn').addEventListener('click', () => {
            isAuthMode = isAuthMode === 'login' ? 'register' : 'login';
            document.getElementById('authTitle').textContent = isAuthMode === 'login' ? 'Вход' : 'Регистрация';
            document.getElementById('authSubmitBtn').textContent = isAuthMode === 'login' ? 'Войти' : 'Зарегистрироваться';
            document.getElementById('authSwitchBtn').textContent = isAuthMode === 'login' ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
            document.getElementById('authError').style.display = 'none';
        });

        document.getElementById('authSubmitBtn').addEventListener('click', async () => {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value;
            
            if (!username || !password) { showAuthError('Заполните все поля'); return; }
            if (!validateUsername(username)) { showAuthError('Логин: 2-30 символов (буквы, цифры, пробел, . _ -)'); return; }
            if (password.length < 6) { showAuthError('Пароль должен быть минимум 6 символов'); return; }
            
            const btn = document.getElementById('authSubmitBtn');
            btn.disabled = true;
            btn.textContent = 'Загрузка...';
            
            const email = usernameToEmail(username);
            const norm = username.toLowerCase().trim();
            
            try {
                if (isAuthMode === 'login') {
                    await auth.signInWithEmailAndPassword(email, password);
                } else {
                    const cred = await auth.createUserWithEmailAndPassword(email, password);
                    await cred.user.updateProfile({ displayName: username });
                    await db.ref('users/' + cred.user.uid).set({
                        username: norm,
                        displayName: username,
                        name: username,
                        createdAt: new Date().toISOString()
                    });
                    await db.ref('usernames/' + norm).set(cred.user.uid);
                }
            } catch (err) {
                console.error(err);
                const M = {
                    'auth/user-not-found':'Пользователь не найден',
                    'auth/wrong-password':'Неверный пароль',
                    'auth/invalid-credential':'Неверный логин или пароль',
                    'auth/invalid-email':'Некорректный логин',
                    'auth/email-already-in-use':'Логин занят',
                    'auth/weak-password':'Слабый пароль'
                };
                showAuthError(M[err.code] || err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = isAuthMode === 'login' ? 'Войти' : 'Зарегистрироваться';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('Выйти?')) auth.signOut();
        });

        // --- СЛЕЖКА ЗА СОСТОЯНИЕМ ВХОДА И ПРОВЕРКА ОДОБРЕНИЯ ---
        auth.onAuthStateChanged(async user => {
            document.getElementById('authLoading').style.display = 'none';
            
            if (user) {
                currentUser = user;
                
                let isApproved = false;
                let isAdmin = false;
                
                try {
                    const approvedSnap = await db.ref('approvedUsers/' + user.uid).once('value');
                    isApproved = approvedSnap.exists();
                    
                    const adminSnap = await db.ref('admins/' + user.uid).once('value');
                    isAdmin = adminSnap.val() === true;
                } catch (err) {
                    console.error('Ошибка проверки доступа:', err);
                }

                if (isAdmin) isApproved = true;

                if (!isApproved) {
                    document.getElementById('authScreen').style.display = 'block';
                    document.getElementById('appContent').style.display = 'none';
                    showAuthError('Ваша учётная запись ожидает одобрения администратором. Пожалуйста, свяжитесь с руководством.');
                    return;
                }

                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('appContent').style.display = 'flex';
                document.getElementById('userNameDisplay').textContent = user.displayName || user.email.split('@')[0];
            } else {
                currentUser = null;
                document.getElementById('authScreen').style.display = 'block';
                document.getElementById('appContent').style.display = 'none';
            }
        });

        // --- ЛОГИКА КАЛЬКУЛЯТОРА (без изменений) ---
        let codelSpeeds = [];
        let referenceSpeed = null;

        document.getElementById('addCodel').addEventListener('click', function() {
            const speed = parseFloat(document.getElementById('codelSpeed').value);
            if (!isNaN(speed)) {
                codelSpeeds.push(speed);
                updateTable();
                calculateAverages();
            }
            document.getElementById('codelSpeed').value = '';
        });

        document.getElementById('setReference').addEventListener('click', function() {
            referenceSpeed = parseFloat(document.getElementById('referenceSpeed').value);
            if (!isNaN(referenceSpeed)) {
                calculateAverages();
            }
            document.getElementById('referenceSpeed').value = '';
        });

        function updateTable() {
            const tableBody = document.getElementById('dataTable');
            tableBody.innerHTML = '';

            codelSpeeds.forEach((speed, index) => {
                const row = document.createElement('tr');
                const codelCell = document.createElement('td');
                const actionCell = document.createElement('td');

                codelCell.innerText = speed.toFixed(2);
                const deleteButton = document.createElement('button');
                deleteButton.innerText = 'Удалить';
                deleteButton.onclick = () => {
                    codelSpeeds.splice(index, 1);
                    updateTable();
                    calculateAverages();
                };
                actionCell.appendChild(deleteButton);

                row.appendChild(codelCell);
                row.appendChild(actionCell);
                tableBody.appendChild(row);
            });
        }

        function calculateAverages() {
            const averageCodel = codelSpeeds.length > 0 ? codelSpeeds.reduce((a, b) => a + b, 0) / codelSpeeds.length : 0;
            const averageReference = referenceSpeed || 0;

            document.getElementById('averageCodel').innerText = averageCodel.toFixed(2);
            document.getElementById('averageReference').innerText = averageReference.toFixed(2);
            calculateError(averageCodel, averageReference);
        }

        function calculateError(codelAverage, referenceAverage) {
            let errorPercentage = 0;
            let formulaText = '';

            if (referenceAverage > 0) {
                errorPercentage = ((codelAverage - referenceAverage) / referenceAverage) * 100;
                formulaText = `(( ${codelAverage.toFixed(2)} - ${referenceAverage.toFixed(2)} ) / ${referenceAverage.toFixed(2)}) * 100`;
            } else if (codelAverage > 0) {
                errorPercentage = ((codelAverage - referenceAverage) / (referenceAverage || 1)) * 100;
                formulaText = `(( ${codelAverage.toFixed(2)} - Vпит ) / Vпит) * 100`;
            }

            document.getElementById('errorPercentage').innerText = errorPercentage.toFixed(2);
            document.getElementById('formulaDisplay').innerText = formulaText;
            updateErrorDisplay(errorPercentage);
        }

        function updateErrorDisplay(error) {
            const errorDisplay = document.getElementById('errorDisplay');
            errorDisplay.style.color = getErrorColor(error);
        }

        function getErrorColor(error) {
            if (error > 2 || error < -2) {
                return 'red';
            } else if (error === 2 || error === -2) {
                return 'orange';
            } else {
                return 'green';
            }
        }
    </script>
</body>
</html>
