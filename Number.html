<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учет счетов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        .budget { background-color: #fff3cd; }
        .urgent { background-color: #f8d7da; }
        .debt { background-color: #ffe5d0; }
        .highlighted { border-left: 5px solid #dc3545; }
        .status-new { }
        .status-inwork { background-color: #cce5ff; }
        .status-completed { opacity: 0.6; text-decoration: line-through; background-color: #d4edda; }
        .badge-budget { background-color: #ffc107; }
        .badge-urgent { background-color: #dc3545; color: white; }
        .badge-debt { background-color: #fd7e14; color: white; }
        .badge-matched { background-color: #28a745; color: white; }
        .badge-new { background-color: #6c757d; color: white; }
        .badge-inwork { background-color: #007bff; color: white; }
        .badge-completed { background-color: #28a745; color: white; }
        .table-container { max-height: 600px; overflow-y: auto; }
        .table-info { display: none; margin-top: 10px; }
        .device-filter { margin-bottom: 15px; }
        .device-tag { 
            display: inline-block; 
            margin: 3px; 
            padding: 5px 10px; 
            border-radius: 15px; 
            cursor: pointer; 
            transition: all 0.3s;
            user-select: none;
        }
        .device-tag:hover { 
            transform: scale(1.05); 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .device-tag.active { 
            box-shadow: 0 0 0 2px #007bff;
            font-weight: bold;
        }
        .sync-status {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        .sync-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .sync-online { background-color: #28a745; }
        .sync-offline { background-color: #dc3545; }
        .sync-syncing { background-color: #ffc107; }
    </style>
</head>
<body>
    <!-- Индикатор синхронизации -->
    <div class="sync-status">
        <span class="badge bg-light text-dark border">
            <span class="sync-indicator sync-offline" id="syncIndicator"></span>
            <span id="syncText">Не подключено</span>
        </span>
    </div>

    <div class="container-fluid mt-4">
        <h1 class="mb-4">📊 Учет счетов</h1>
        
        <!-- Загрузка файлов -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5>📁 Загрузка таблиц</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Таблица 1 (счета с приборами):</label>
                            <input type="file" id="table1File" class="form-control" accept=".xlsx,.xls">
                            <small class="text-muted">Поддерживаются объединенные ячейки</small>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Таблица 2 (контрольная с пометками):</label>
                            <input type="file" id="table2File" class="form-control" accept=".xlsx,.xls">
                        </div>
                        
                        <button class="btn btn-success" onclick="loadBothTables()">📥 Загрузить</button>
                        <button class="btn btn-danger" onclick="clearAllData()">🗑 Очистить</button>
                        
                        <div id="table1Info" class="alert alert-info table-info"></div>
                        <div id="table2Info" class="alert alert-info table-info"></div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h5>🔍 Фильтры</h5>
                    </div>
                    <div class="card-body">
                        <div class="btn-group mb-3 flex-wrap" role="group">
                            <button class="btn btn-outline-primary" onclick="setFilter('all')">Все</button>
                            <button class="btn btn-outline-secondary" onclick="setFilter('new')">Новые</button>
                            <button class="btn btn-outline-info" onclick="setFilter('inwork')">В работе</button>
                            <button class="btn btn-outline-success" onclick="setFilter('completed')">Выполненные</button>
                            <button class="btn btn-outline-warning" onclick="setFilter('highlighted')">С пометками</button>
                        </div>
                        
                        <input type="text" id="search" class="form-control mb-3" placeholder="🔎 Поиск..." oninput="renderTable()">
                        
                        <div id="deviceTags" class="mt-2"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Статистика -->
        <div class="row mb-3">
            <div class="col-md-2">
                <div class="card bg-primary text-white">
                    <div class="card-body text-center">
                        <h6>Всего</h6>
                        <h3 id="totalCount">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card bg-secondary text-white">
                    <div class="card-body text-center">
                        <h6>Новые</h6>
                        <h3 id="newCount">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card bg-info text-white">
                    <div class="card-body text-center">
                        <h6>В работе</h6>
                        <h3 id="inworkCount">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card bg-success text-white">
                    <div class="card-body text-center">
                        <h6>Выполнено</h6>
                        <h3 id="completedCount">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card bg-warning text-white">
                    <div class="card-body text-center">
                        <h6>С пометками</h6>
                        <h3 id="highlightedCount">0</h3>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Таблица -->
        <div class="card">
            <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
                <h5 id="tableTitle">📋 Все счета</h5>
                <button class="btn btn-sm btn-light" onclick="exportToExcel()">📊 Экспорт</button>
            </div>
            <div class="card-body table-container">
                <div class="table-responsive">
                    <table class="table table-hover" id="invoicesTable">
                        <thead class="table-dark">
                            <tr>
                                <th>№ счета</th>
                                <th>Дата</th>
                                <th>Контрагент</th>
                                <th>Прибор</th>
                                <th>Кол-во</th>
                                <th>Сумма</th>
                                <th>Оплата</th>
                                <th>Статус</th>
                                <th>Пометки</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAlMduGeljWyCDj9mje3-ynHiNavAlPC8I",
            authDomain: "vlad-csms-af6df.firebaseapp.com",
            databaseURL: "https://vlad-csms-af6df-default-rtdb.firebaseio.com",
            projectId: "vlad-csms-af6df",
            storageBucket: "vlad-csms-af6df.firebasestorage.app",
            messagingSenderId: "417297799117",
            appId: "1:417297799117:web:0a93dce429cd37db499684",
            measurementId: "G-MD79ZVT24Z"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        let table1Data = [];
        let table2Data = [];
        let currentFilter = 'all';
        let selectedDevice = null;
        let deviceTypes = new Set();
        
        // Чтение Excel с обработкой объединенных ячеек
        function readExcelWithMergedCells(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    let allData = [];
                    
                    workbook.SheetNames.forEach(sheetName => {
                        const sheet = workbook.Sheets[sheetName];
                        const jsonData = XLSX.utils.sheet_to_json(sheet, {
                            defval: '',
                            raw: true,
                            header: 1
                        });
                        
                        console.log(`Лист "${sheetName}": ${jsonData.length} строк`);
                        
                        let headerRowIndex = -1;
                        let headers = [];
                        
                        // Ищем шапку
                        for (let i = 0; i < jsonData.length; i++) {
                            const row = jsonData[i];
                            if (row.some(cell => 
                                cell && cell.toString().toLowerCase().includes('номер') && 
                                cell.toString().toLowerCase().includes('счет')
                            )) {
                                headerRowIndex = i;
                                headers = row.map(h => h ? h.toString().trim() : '');
                                console.log(`Шапка в строке ${i + 1}:`, headers);
                                break;
                            }
                        }
                        
                        if (headerRowIndex === -1) {
                            console.log(`Шапка не найдена в листе "${sheetName}"`);
                            return;
                        }
                        
                        // Обрабатываем данные
                        for (let i = headerRowIndex + 1; i < jsonData.length; i++) {
                            const row = jsonData[i];
                            let invoiceNumber = '';
                            let invoiceDate = '';
                            let contractor = '';
                            let device = '';
                            let quantity = '';
                            let amount = '';
                            let paymentDate = '';
                            
                            headers.forEach((header, index) => {
                                const value = row[index] || '';
                                
                                if (header.includes('Номер') && header.includes('счет')) {
                                    invoiceNumber = value.toString().trim();
                                } else if (header.includes('Дата') && header.includes('выписк')) {
                                    invoiceDate = value.toString().trim();
                                } else if (header.includes('Контрагент') || header.includes('Наименование')) {
                                    contractor = value.toString().trim();
                                } else if (header.includes('Прибор')) {
                                    device = value.toString().trim();
                                } else if (header.includes('Кол-во') || header.includes('Колич')) {
                                    quantity = value.toString().trim();
                                } else if (header.includes('Сумма') || header.includes('Всего')) {
                                    amount = value.toString().trim();
                                } else if (header.includes('Оплат')) {
                                    paymentDate = value.toString().trim();
                                }
                            });
                            
                            if (invoiceNumber && invoiceNumber.includes('-')) {
                                allData.push({
                                    'Номер счета': invoiceNumber,
                                    'Дата выписки': invoiceDate,
                                    'Контрагент (Наименование)': contractor,
                                    'Прибор': device,
                                    'Кол-во': quantity,
                                    'Сумма': amount,
                                    'Всего по счету': amount,
                                    'Оплата': '',
                                    'Дата оплаты': paymentDate
                                });
                            }
                        }
                    });
                    
                    // Удаляем дубликаты
                    const uniqueData = [];
                    const seen = new Set();
                    allData.forEach(row => {
                        if (!seen.has(row['Номер счета'])) {
                            seen.add(row['Номер счета']);
                            uniqueData.push(row);
                        }
                    });
                    
                    console.log(`Найдено счетов: ${uniqueData.length}`);
                    console.log('Пример:', uniqueData.slice(0, 3));
                    
                    callback(uniqueData);
                    
                } catch (error) {
                    console.error('Ошибка:', error);
                    alert('Ошибка чтения файла: ' + error.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }
        
        // Загрузка Таблицы 1
        function loadTable1() {
            const fileInput = document.getElementById('table1File');
            if (!fileInput.files[0]) {
                alert('Выберите файл Таблицы 1');
                return;
            }
            
            readExcelWithMergedCells(fileInput.files[0], function(data) {
                if (data.length === 0) {
                    alert('Не удалось найти счета. Проверьте формат данных.');
                    return;
                }
                
                table1Data = data.map(row => ({
                    ...row,
                    isBudget: false,
                    isUrgent: false,
                    isDebt: false,
                    isMatched: false,
                    status: 'new',
                    statusDate: null,
                    paymentStatus: '',
                    workDuration: ''
                }));
                
                saveToStorage();
                matchTables();
                renderTable();
                
                const infoDiv = document.getElementById('table1Info');
                infoDiv.style.display = 'block';
                infoDiv.innerHTML = `✅ Загружено ${table1Data.length} счетов`;
                setTimeout(() => infoDiv.style.display = 'none', 5000);
            });
        }
        
        // Загрузка Таблицы 2
        function loadTable2() {
            const fileInput = document.getElementById('table2File');
            if (!fileInput.files[0]) {
                alert('Выберите файл Таблицы 2');
                return;
            }
            
            readExcelWithMergedCells(fileInput.files[0], function(data) {
                if (data.length === 0) {
                    alert('Не удалось найти счета. Проверьте формат данных.');
                    return;
                }
                
                table2Data = data;
                saveToStorage();
                matchTables();
                renderTable();
                
                const infoDiv = document.getElementById('table2Info');
                infoDiv.style.display = 'block';
                infoDiv.innerHTML = `✅ Загружено ${table2Data.length} записей`;
                setTimeout(() => infoDiv.style.display = 'none', 5000);
            });
        }
        
        // Загрузка обеих
        function loadBothTables() {
            const file1 = document.getElementById('table1File').files[0];
            const file2 = document.getElementById('table2File').files[0];
            
            if (file1 && file2) {
                loadTable1();
                setTimeout(loadTable2, 500);
            } else if (file1) {
                loadTable1();
            } else if (file2) {
                loadTable2();
            } else {
                alert('Выберите хотя бы один файл');
            }
        }
        
        // Сопоставление таблиц
        function matchTables() {
            if (!table1Data.length || !table2Data.length) return;
            
            const table2Map = {};
            table2Data.forEach(row => {
                const num = row['Номер счета']?.trim();
                if (num) table2Map[num] = row;
            });
            
            table1Data = table1Data.map(row => {
                const num = row['Номер счета']?.trim();
                const matched = table2Map[num];
                
                if (matched) {
                    return {
                        ...row,
                        isMatched: true,
                        isBudget: checkMark(matched['Б']) || checkMark(matched['Бюджет']),
                        isUrgent: checkMark(matched['С']) || checkMark(matched['Срочность']),
                        isDebt: checkMark(matched['З']) || checkMark(matched['Задолженность']),
                        paymentStatus: matched['Наличие оплаты'] || '',
                        workDuration: matched['Продолж. работ'] || ''
                    };
                }
                return row;
            });
            
            saveToStorage();
        }
        
        function checkMark(value) {
            if (!value) return false;
            const str = value.toString().trim().toLowerCase();
            return str === 'да' || str === 'true' || str === '1' || str === '+' || str === '✓' || str === 'yes';
        }
        
        // Сохранение
        function saveToStorage() {
            localStorage.setItem('table1Data', JSON.stringify(table1Data));
            localStorage.setItem('table2Data', JSON.stringify(table2Data));
            
            // Firebase
            database.ref('invoices').set({
                table1Data: table1Data,
                table2Data: table2Data,
                timestamp: new Date().toISOString()
            }).catch(err => console.error('Firebase error:', err));
            
            updateDeviceTypes();
        }
        
        // Загрузка из localStorage
        function loadFromStorage() {
            const saved1 = localStorage.getItem('table1Data');
            const saved2 = localStorage.getItem('table2Data');
            if (saved1) table1Data = JSON.parse(saved1);
            if (saved2) table2Data = JSON.parse(saved2);
            updateDeviceTypes();
            renderTable();
        }
        
        // Обновление типов приборов
        function updateDeviceTypes() {
            deviceTypes.clear();
            table1Data.forEach(row => {
                const device = row['Прибор'] || '';
                if (device && device.trim()) {
                    deviceTypes.add(device.split(' ').slice(0, 3).join(' '));
                }
            });
            
            const container = document.getElementById('deviceTags');
            container.innerHTML = '';
            Array.from(deviceTypes).sort().forEach(device => {
                const tag = document.createElement('span');
                tag.className = 'device-tag badge bg-light text-dark border';
                tag.textContent = device;
                tag.onclick = () => {
                    selectedDevice = selectedDevice === device ? null : device;
                    renderTable();
                };
                container.appendChild(tag);
            });
        }
        
        // Фильтры
        function setFilter(filter) {
            currentFilter = filter;
            renderTable();
        }
        
        // Изменение статуса
        function changeStatus(invoiceNumber, newStatus) {
            table1Data = table1Data.map(row => {
                if (row['Номер счета'] === invoiceNumber) {
                    row.status = newStatus;
                    row.statusDate = new Date().toISOString();
                }
                return row;
            });
            saveToStorage();
            renderTable();
        }
        
        // Очистка
        function clearAllData() {
            if (confirm('Удалить все данные?')) {
                table1Data = [];
                table2Data = [];
                localStorage.removeItem('table1Data');
                localStorage.removeItem('table2Data');
                database.ref('invoices').remove();
                updateDeviceTypes();
                renderTable();
            }
        }
        
        // Рендер таблицы
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const searchQuery = document.getElementById('search').value.toLowerCase();
            
            let filteredData = [...table1Data];
            
            if (currentFilter === 'new') {
                filteredData = filteredData.filter(row => row.status === 'new');
            } else if (currentFilter === 'inwork') {
                filteredData = filteredData.filter(row => row.status === 'inwork');
            } else if (currentFilter === 'completed') {
                filteredData = filteredData.filter(row => row.status === 'completed');
            } else if (currentFilter === 'highlighted') {
                filteredData = filteredData.filter(row => row.isBudget || row.isUrgent || row.isDebt);
            }
            
            if (selectedDevice) {
                filteredData = filteredData.filter(row => {
                    const device = row['Прибор'] || '';
                    return device.split(' ').slice(0, 3).join(' ') === selectedDevice;
                });
            }
            
            if (searchQuery) {
                filteredData = filteredData.filter(row => 
                    (row['Номер счета'] && row['Номер счета'].toLowerCase().includes(searchQuery)) ||
                    (row['Контрагент (Наименование)'] && row['Контрагент (Наименование)'].toLowerCase().includes(searchQuery)) ||
                    (row['Прибор'] && row['Прибор'].toLowerCase().includes(searchQuery))
                );
            }
            
            // Статистика
            document.getElementById('totalCount').textContent = table1Data.length;
            document.getElementById('newCount').textContent = table1Data.filter(r => r.status === 'new').length;
            document.getElementById('inworkCount').textContent = table1Data.filter(r => r.status === 'inwork').length;
            document.getElementById('completedCount').textContent = table1Data.filter(r => r.status === 'completed').length;
            document.getElementById('highlightedCount').textContent = table1Data.filter(r => r.isBudget || r.isUrgent || r.isDebt).length;
            
            // Заголовок
            const titles = {
                'all': 'Все счета',
                'new': 'Новые счета',
                'inwork': 'Счета в работе',
                'completed': 'Выполненные счета',
                'highlighted': 'Счета с пометками'
            };
            document.getElementById('tableTitle').textContent = `📋 ${titles[currentFilter] || 'Счета'} (${filteredData.length})`;
            
            // Рендер
            tbody.innerHTML = '';
            
            if (filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted">Нет данных</td></tr>';
                return;
            }
            
            filteredData.forEach(row => {
                const tr = document.createElement('tr');
                
                if (row.status === 'inwork') tr.classList.add('status-inwork');
                if (row.status === 'completed') tr.classList.add('status-completed');
                if (row.isBudget) tr.classList.add('budget');
                if (row.isUrgent) tr.classList.add('urgent');
                if (row.isDebt) tr.classList.add('debt');
                
                tr.innerHTML = `
                    <td><strong>${row['Номер счета'] || ''}</strong></td>
                    <td>${row['Дата выписки'] || ''}</td>
                    <td>${row['Контрагент (Наименование)'] || ''}</td>
                    <td>${row['Прибор'] || ''}</td>
                    <td>${row['Кол-во'] || ''}</td>
                    <td>${row['Всего по счету'] || row['Сумма'] || ''}</td>
                    <td>${row.paymentStatus || '—'}</td>
                    <td>
                        ${row.status === 'new' ? '<span class="badge badge-new">Новый</span>' : ''}
                        ${row.status === 'inwork' ? '<span class="badge badge-inwork">В работе</span>' : ''}
                        ${row.status === 'completed' ? '<span class="badge badge-completed">✓ Выполнен</span>' : ''}
                    </td>
                    <td>
                        ${row.isBudget ? '<span class="badge badge-budget me-1">Бюджет</span>' : ''}
                        ${row.isUrgent ? '<span class="badge badge-urgent me-1">Срочно</span>' : ''}
                        ${row.isDebt ? '<span class="badge badge-debt me-1">Задолженность</span>' : ''}
                        ${!row.isBudget && !row.isUrgent && !row.isDebt ? '<span class="text-muted">—</span>' : ''}
                    </td>
                    <td>
                        ${row.status === 'new' ? `
                            <button class="btn btn-sm btn-info me-1" onclick="changeStatus('${row['Номер счета']}', 'inwork')">▶</button>
                            <button class="btn btn-sm btn-success" onclick="changeStatus('${row['Номер счета']}', 'completed')">✓</button>
                        ` : ''}
                        ${row.status === 'inwork' ? `
                            <button class="btn btn-sm btn-success me-1" onclick="changeStatus('${row['Номер счета']}', 'completed')">✓</button>
                            <button class="btn btn-sm btn-secondary" onclick="changeStatus('${row['Номер счета']}', 'new')">↩</button>
                        ` : ''}
                        ${row.status === 'completed' ? `
                            <button class="btn btn-sm btn-warning me-1" onclick="changeStatus('${row['Номер счета']}', 'inwork')">↩</button>
                            <button class="btn btn-sm btn-secondary" onclick="changeStatus('${row['Номер счета']}', 'new')">↩</button>
                        ` : ''}
                    </td>
                `;
                
                tbody.appendChild(tr);
            });
        }
        
        // Экспорт
        function exportToExcel() {
            if (!table1Data.length) {
                alert('Нет данных');
                return;
            }
            
            const exportData = table1Data.map(row => ({
                'Номер счета': row['Номер счета'],
                'Дата выписки': row['Дата выписки'],
                'Контрагент': row['Контрагент (Наименование)'],
                'Прибор': row['Прибор'],
                'Кол-во': row['Кол-во'],
                'Сумма': row['Всего по счету'],
                'Статус': row.status,
                'Бюджет': row.isBudget ? 'Да' : '',
                'Срочно': row.isUrgent ? 'Да' : '',
                'Задолженность': row.isDebt ? 'Да' : ''
            }));
            
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Счета');
            XLSX.writeFile(wb, 'счета_экспорт.xlsx');
        }
        
        // Инициализация
        window.onload = function() {
            loadFromStorage();
            renderTable();
        };
    </script>
</body>
</html>
