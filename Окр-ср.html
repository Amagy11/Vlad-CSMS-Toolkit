<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись данных</title>
    <style>
        /* Основные стили */
        * {
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #f5f7fa 0%, #e4e7eb 100%);
            background-attachment: fixed;
            color: #333;
            min-height: 100vh;
        }
        
        /* Шапка сайта */
        header {
            background: linear-gradient(to bottom, #003366 0%, #002244 100%);
            color: #ffffff;
            padding: 15px 20px;
            box-shadow: 0 4px 12px rgba(0, 34, 68, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        /* Основной контейнер */
        .container {
            max-width: 600px;
            margin: 20px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(0, 34, 68, 0.1);
        }
        
        h2 {
            color: #003366;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
        }
        
        /* Поля ввода */
        input[type="number"], 
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border: 1px solid #e0e6ed;
            border-radius: 6px;
            font-size: 16px;
            background-color: #f8f9fb;
        }
        
        input[type="number"]:focus, 
        input[type="text"]:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 2px rgba(0, 102, 204, 0.2);
        }
        
        /* Кнопки */
        button {
            padding: 12px 20px;
            background: linear-gradient(to bottom, #0066cc 0%, #003366 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 4px 8px rgba(0, 51, 102, 0.3);
            margin-top: 10px;
            width: 100%;
        }
        
        button:hover {
            background: linear-gradient(to bottom, #0088ff 0%, #0055aa 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 85, 170, 0.4);
        }
        
        /* Записи */
        .record {
            margin-top: 20px;
            padding: 15px;
            background-color: rgba(0, 102, 204, 0.05);
            border: 1px solid rgba(0, 102, 204, 0.1);
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0, 34, 68, 0.1);
        }
        
        .record-header {
            font-weight: 600;
            margin-bottom: 10px;
            color: #003366;
            font-size: 16px;
        }
        
        .record-data {
            margin: 8px 0;
            color: #333;
        }
        
        .edit-delete-buttons {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        
        .edit-delete-buttons button {
            margin: 0;
            flex: 1;
        }
        
        /* Адаптивность */
        @media (max-width: 768px) {
            .container {
                margin: 10px;
                padding: 15px;
            }
            
            input[type="number"], 
            input[type="text"],
            button {
                padding: 10px 12px;
                font-size: 14px;
            }
            
            .record-header {
                font-size: 15px;
            }
        }

        /* --- Стили для логина --- */
        .auth-container {
            max-width: 400px;
            margin: 50px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 34, 68, 0.15);
        }
        .auth-title {
            font-size: 24px;
            font-weight: bold;
            color: #003366;
            text-align: center;
            margin-bottom: 20px;
        }
        .auth-field { margin-bottom: 15px; }
        .auth-field label { display: block; margin-bottom: 5px; color: #003366; font-weight: 500; }
        .auth-field input {
            width: 100%;
            padding: 10px;
            border: 1px solid #e0e6ed;
            border-radius: 6px;
            background: #f8f9fb;
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(to bottom, #0066cc 0%, #003366 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .auth-btn:hover { background: linear-gradient(to bottom, #0088ff 0%, #0055aa 100%); }
        .auth-switch {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 15px;
            background: none;
            border: none;
            color: #0066cc;
            cursor: pointer;
            font-size: 14px;
        }
        .auth-switch:hover { text-decoration: underline; }
        .auth-error {
            background: #ffebee;
            color: #d32f2f;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
        }
        .logout-btn:hover { background: rgba(255, 255, 255, 0.3); }
    </style>
    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>

    <!-- Экран загрузки -->
    <div id="authLoading" style="text-align:center; padding-top:100px; font-size:18px; color:#003366;">
        Проверка входа...
    </div>

    <!-- Экран логина -->
    <div id="authScreen" class="auth-container" style="display:none;">
        <div class="auth-title" id="authTitle">Вход</div>
        <div id="authError" class="auth-error"></div>
        
        <div class="auth-field">
            <label>Логин</label>
            <input type="text" id="authUsername" placeholder="Введите логин" maxlength="30">
        </div>
        <div class="auth-field">
            <label>Пароль</label>
            <input type="password" id="authPassword" placeholder="Минимум 6 символов">
        </div>
        
        <button class="auth-btn" id="authSubmitBtn">Войти</button>
        <button class="auth-switch" id="authSwitchBtn">Нет аккаунта? Зарегистрироваться</button>
    </div>

    <!-- Основной контент (скрыт до входа) -->
    <div id="appContent" style="display:none;">
        <header>
            <div class="logo">Запись данных</div>
            <div class="user-info">
                <span id="userNameDisplay"></span>
                <button class="logout-btn" id="logoutBtn">Выйти</button>
            </div>
        </header>

        <div class="container">
            <h2>Запись параметров окружающей среды</h2>
            
            <input type="number" id="humidity" placeholder="Влажность (%)" required>
            <input type="number" id="temperature" placeholder="Температура (°C)" required>
            <input type="number" id="pressure" placeholder="Давление (мм рт. ст.)" required>
            
            <button id="saveButton">Сохранить</button>

            <div id="records"></div>
        </div>
    </div>

    <script>
        // Конфигурация Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAlMduGeljWyCDj9mje3-ynHiNavAlPC8I",
            authDomain: "vlad-csms-af6df.firebaseapp.com",
            databaseURL: "https://vlad-csms-af6df-default-rtdb.firebaseio.com",
            projectId: "vlad-csms-af6df",
            storageBucket: "vlad-csms-af6df.firebasestorage.app",
            messagingSenderId: "417297799117",
            appId: "1:417297799117:web:07ce2915cbfe0cb1499684",
            measurementId: "G-0EMQB4HYSQ"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        const EMAIL_DOMAIN = "@invoice.local";
        let isAuthMode = 'login';
        let currentUser = null;

        // Транслитерация
        const TRANSLIT_MAP = {'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'};
        function transliterate(s) { let r = ''; for (const c of s) { const l = c.toLowerCase(); r += (TRANSLIT_MAP[l] !== undefined) ? TRANSLIT_MAP[l] : c; } return r; }
        function usernameToEmail(u) { const n = u.toLowerCase().trim(); return transliterate(n).replace(/[^a-z0-9._-]/g, '.') + EMAIL_DOMAIN; }
        function validateUsername(u) { const t = u.trim(); if (t.length < 2 || t.length > 30) return false; return /^[а-яёa-z0-9\s._-]+$/i.test(t); }

        // --- ЛОГИКА АВТОРИЗАЦИИ ---
        function showAuthError(msg) {
            const e = document.getElementById('authError');
            e.textContent = msg;
            e.style.display = 'block';
        }

        document.getElementById('authSwitchBtn').addEventListener('click', () => {
            isAuthMode = isAuthMode === 'login' ? 'register' : 'login';
            document.getElementById('authTitle').textContent = isAuthMode === 'login' ? 'Вход' : 'Регистрация';
            document.getElementById('authSubmitBtn').textContent = isAuthMode === 'login' ? 'Войти' : 'Зарегистрироваться';
            document.getElementById('authSwitchBtn').textContent = isAuthMode === 'login' ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
            document.getElementById('authError').style.display = 'none';
        });

        document.getElementById('authSubmitBtn').addEventListener('click', async () => {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value;
            
            if (!username || !password) { showAuthError('Заполните все поля'); return; }
            if (!validateUsername(username)) { showAuthError('Логин: 2-30 символов (буквы, цифры, пробел, . _ -)'); return; }
            if (password.length < 6) { showAuthError('Пароль должен быть минимум 6 символов'); return; }
            
            const btn = document.getElementById('authSubmitBtn');
            btn.disabled = true;
            btn.textContent = 'Загрузка...';
            
            const email = usernameToEmail(username);
            const norm = username.toLowerCase().trim();
            
            try {
                if (isAuthMode === 'login') {
                    await auth.signInWithEmailAndPassword(email, password);
                } else {
                    const cred = await auth.createUserWithEmailAndPassword(email, password);
                    await cred.user.updateProfile({ displayName: username });
                    await database.ref('users/' + cred.user.uid).set({
                        username: norm,
                        displayName: username,
                        name: username,
                        createdAt: new Date().toISOString()
                    });
                    await database.ref('usernames/' + norm).set(cred.user.uid);
                }
            } catch (err) {
                console.error(err);
                const M = {
                    'auth/user-not-found':'Пользователь не найден',
                    'auth/wrong-password':'Неверный пароль',
                    'auth/invalid-credential':'Неверный логин или пароль',
                    'auth/invalid-email':'Некорректный логин',
                    'auth/email-already-in-use':'Логин занят',
                    'auth/weak-password':'Слабый пароль'
                };
                showAuthError(M[err.code] || err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = isAuthMode === 'login' ? 'Войти' : 'Зарегистрироваться';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('Выйти?')) auth.signOut();
        });

        // --- СЛЕЖКА ЗА СОСТОЯНИЕМ ВХОДА И ПРОВЕРКА ОДОБРЕНИЯ ---
        auth.onAuthStateChanged(async user => {
            document.getElementById('authLoading').style.display = 'none';
            
            if (user) {
                currentUser = user;
                
                let isApproved = false;
                let isAdmin = false;
                
                try {
                    const approvedSnap = await database.ref('approvedUsers/' + user.uid).once('value');
                    isApproved = approvedSnap.exists();
                    
                    const adminSnap = await database.ref('admins/' + user.uid).once('value');
                    isAdmin = adminSnap.val() === true;
                } catch (err) {
                    console.error('Ошибка проверки доступа:', err);
                }

                if (isAdmin) isApproved = true;

                if (!isApproved) {
                    document.getElementById('authScreen').style.display = 'block';
                    document.getElementById('appContent').style.display = 'none';
                    showAuthError('Ваша учётная запись ожидает одобрения администратором. Пожалуйста, свяжитесь с руководством.');
                    return;
                }

                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                document.getElementById('userNameDisplay').textContent = user.displayName || user.email.split('@')[0];
                
                // Запускаем приложение
                initApp();
            } else {
                currentUser = null;
                document.getElementById('authScreen').style.display = 'block';
                document.getElementById('appContent').style.display = 'none';
            }
        });

        // --- ЛОГИКА ПРИЛОЖЕНИЯ ---
        function initApp() {
            document.getElementById('saveButton').addEventListener('click', saveRecord);
            loadRecords();
        }

        function saveRecord() {
            const humidity = document.getElementById('humidity').value;
            const temperature = document.getElementById('temperature').value;
            const pressure = document.getElementById('pressure').value;

            if (humidity && temperature && pressure) {
                const timestamp = Date.now();
                const date = new Date(timestamp);
                const record = {
                    humidity,
                    temperature,
                    pressure,
                    timestamp,
                    date: date.toLocaleDateString(),
                    time: date.toLocaleTimeString(),
                };

                database.ref('records').push(record);
                clearInputs();
            } else {
                alert('Пожалуйста, заполните все поля.');
            }
        }

        function loadRecords() {
            const recordsDiv = document.getElementById('records');
            recordsDiv.innerHTML = '';

            const recordsRef = database.ref('records');
            recordsRef.on('value', (snapshot) => {
                recordsDiv.innerHTML = '';
                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        const record = childSnapshot.val();
                        const recordId = childSnapshot.key;

                        const recordElement = document.createElement('div');
                        recordElement.classList.add('record');

                        const recordHeader = document.createElement('div');
                        recordHeader.classList.add('record-header');
                        recordHeader.textContent = `Запись от ${record.date} в ${record.time}`;

                        const recordDataHumidity = document.createElement('div');
                        recordDataHumidity.classList.add('record-data');
                        recordDataHumidity.textContent = `Влажность: ${record.humidity}%`;

                        const recordDataTemperature = document.createElement('div');
                        recordDataTemperature.classList.add('record-data');
                        recordDataTemperature.textContent = `Температура: ${record.temperature}°C`;

                        const recordDataPressure = document.createElement('div');
                        recordDataPressure.classList.add('record-data');
                        recordDataPressure.textContent = `Давление: ${record.pressure} мм рт. ст.`;

                        const buttonsDiv = document.createElement('div');
                        buttonsDiv.classList.add('edit-delete-buttons');

                        const editButton = document.createElement('button');
                        editButton.textContent = 'Изменить';
                        editButton.onclick = () => editRecord(recordId);

                        const deleteButton = document.createElement('button');
                        deleteButton.textContent = 'Удалить';
                        deleteButton.onclick = () => deleteRecord(recordId);

                        buttonsDiv.appendChild(editButton);
                        buttonsDiv.appendChild(deleteButton);

                        recordElement.appendChild(recordHeader);
                        recordElement.appendChild(recordDataHumidity);
                        recordElement.appendChild(recordDataTemperature);
                        recordElement.appendChild(recordDataPressure);
                        recordElement.appendChild(buttonsDiv);
                        recordsDiv.appendChild(recordElement);
                    });
                }
            });
        }

        function clearInputs() {
            document.getElementById('humidity').value = '';
            document.getElementById('temperature').value = '';
            document.getElementById('pressure').value = '';
        }

        function editRecord(id) {
            const recordRef = database.ref('records/' + id);
            recordRef.get()
                .then(snapshot => {
                    const record = snapshot.val();
                    if (record) {
                        document.getElementById('humidity').value = record.humidity;
                        document.getElementById('temperature').value = record.temperature;
                        document.getElementById('pressure').value = record.pressure;
                    }
                });
        }

        function deleteRecord(id) {
            if (confirm('Вы уверены, что хотите удалить эту запись?')) {
                database.ref('records/' + id).remove();
            }
        }
    </script>
</body>
</html>
